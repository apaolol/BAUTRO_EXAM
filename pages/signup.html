<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BautroBook Sign Up</title>

    <link rel="stylesheet" href="../src/css/universalStyles.css">

    <!-- Reuses the login box styles for the signup box -->
    <link rel="stylesheet" href="../src/css/signup.css">
</head>

<body>

    <!-- Contains the signup form. Submitting it sends the user to the feed. -->
    <form id="box1" action="feed.html" method="get">

        <!-- Heading with zero shame -->
        <h2>Create Your Account*</h2>
        <p><small>*Account not included.</small></p>

        <!-- Input field for the user's display name -->
        <label for="fullname">Full Name</label>
        <input id="fullname" type="text" placeholder="Your name (we won't remember it)" required>

        <!-- Input field for the chosen username -->
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Pick anything, then use qwer" required minlength="3">

        <!-- Input field for the email address; the browser checks the format -->
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="Email (we'll never email you, we can't)" required>

        <!-- Input field for the password -->
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Anything works, then use 1234 anyway" required>

        <!-- Submits the form; the browser blocks it if any field is invalid -->
        <button type="submit">Sign Up</button>

        <!-- Persuasive link to the login page -->
        <p>
            Already have an account? You don't.
            <a href="login.html">Click here to log in as qwer / 1234</a>
        </p>

    </form>

    <!-- Default footer -->
    <footer class="footer">

       
        <a href="../index.html" class="footer-logo">
            <img src="../assets/logo.jpg" alt="BautroBook Logo">
        </a>

        <!-- Displays the website's copyright notice -->
        <p>&copy; 2026 BautroBook</p>
    </footer>

</body>
</html>
