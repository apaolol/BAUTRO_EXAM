<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Defines the character encoding and makes the page responsive -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Sets the title displayed in the browser tab -->
    <title>BautroBook</title>

    <!-- Links the shared styles used throughout the website -->
    <link rel="stylesheet" href="src/css/universalStyles.css">

    <!-- Links the styles for the login box -->
    <link rel="stylesheet" href="src/css/signup.css">
</head>
<body>

    <!-- Introduces BautroBook and explains the purpose of the website -->
    <div style="text-align: center; margin: 200px auto 10px; max-width: 600px;">

        <!-- Main heading displayed on the homepage -->
        <h1>Find Your People.</h1>

        <!-- Brief description of BautroBook and its focus on social connections -->
        <p>
            Welcome to <strong>BautroBook</strong>, a social space built
            around real connections, shared interests, and meaningful
            conversations. No unnecessary drama. No selling your data.
            Just people connecting over what they love.
        </p>
    </div>

    <!-- Provides a link to proceed to the login page -->
    <div id="box1">
        <a href="pages/signup.html">Join BautroBook</a>
    </div>

    <!-- Footer containing the website logo and copyright -->
    <footer class="footer">

        <!-- Clicking the logo simply returns us to the home  page -->
        <a href="index.html" class="footer-logo">
            <img src="assets/logo.jpg" alt="BautroBook Logo">
        </a>

        <!-- Displays the website's copyright notice -->
        <p>&copy; 2026 BautroBook</p>
    </footer>

</body>
</html>
